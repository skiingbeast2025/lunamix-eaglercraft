      { id: 'codercraft', name: 'CoderCraft Client', category: 'wasm', type: 'Modded', desc: 'Developer focused client with memory inspector, chunk debugger, and packet logger', tag: 'CODERCRAFT', file: 'codercraft.html' },
      { id: 'eagler-reborn', name: 'Eagler Reborn Client', category: 'wasm', type: 'Modded', desc: 'Community restoration build with updated WebRTC relay and server ping embeds', tag: 'REBORN', file: 'eagler-reborn.html' },
      { id: 'jmocraft', name: 'JmoCraft v5.2', category: 'wasm', type: 'Modded', desc: 'Custom adventure build with custom textures, UI styling, and ambient audio', tag: 'JMOCRAFT', file: 'jmocraft.html' },
      { id: 'oddfuture', name: 'OddFuture Client', category: 'wasm', type: 'Modded', desc: 'Custom themed client with OFWGKTA branding, custom sounds, and music player', tag: 'ODDFUTURE', file: 'oddfuture.html' },
      { id: 'uwu-v1', name: 'UwU Client v1 Full', category: 'wasm', type: 'Custom', desc: 'Whimsical anime-inspired client with custom sound effects and pink UI theme', tag: 'UWU V1', file: 'uwu-v1.html' },
      { id: 'uwu-b2', name: 'UwU Client Beta 2', category: 'wasm', type: 'Custom', desc: 'Beta 2 release of UwU client with updated particle trails and custom fonts', tag: 'UWU B2', file: 'uwu-b2.html' },
      { id: 'uwu-lite', name: 'UwU Lite 2', category: 'wasm', type: 'Custom', desc: 'Resource-friendly edition of UwU client keeping the custom aesthetic with high FPS', tag: 'UWU LITE', file: 'uwu-lite.html' }
    ];

    let currentVersionId = '26.3';
    let activeCategory = 'all';
    let searchQuery = '';

    function init() {
      // Check query params for specific client
      const params = new URLSearchParams(window.location.search);
      const v = params.get('v');
      if (v && VERSIONS.find(x => x.id === v)) {
        currentVersionId = v;
      }

      // Keyboard shortcut: '/' focuses search input
      document.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
          e.preventDefault();
          const searchInput = document.getElementById('client-search');
          if (searchInput) {
            searchInput.focus();
            searchInput.select();
          }
        }
      });

      const wrapper = document.getElementById('player-frame-wrapper');
      if (wrapper) {
        wrapper.addEventListener('click', () => {
          const iframe = document.getElementById('player-iframe');
          if (iframe) iframe.focus();
        });
      }

      renderGrid();
      loadVersion(currentVersionId, false);
    }

    function setCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) {
          btn.className = 'cat-pill px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 cursor-pointer whitespace-nowrap';
        } else {
          btn.className = 'cat-pill px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-900/90 text-slate-400 hover:text-white border border-slate-800 cursor-pointer whitespace-nowrap';
        }
      });
      renderGrid();
    }

    function handleSearch(query) {
      searchQuery = (query || '').toLowerCase().trim();
      renderGrid();
    }

    function getFilteredVersions() {
      return VERSIONS.filter(v => {
        // Category check
        const matchesCategory = activeCategory === 'all' || v.category === activeCategory;
        if (!matchesCategory) return false;

        // Search check
        if (!searchQuery) return true;
        return v.name.toLowerCase().includes(searchQuery) ||
               v.desc.toLowerCase().includes(searchQuery) ||
               v.tag.toLowerCase().includes(searchQuery) ||
               v.type.toLowerCase().includes(searchQuery) ||
               v.id.toLowerCase().includes(searchQuery);
      });
    }

    function renderGrid() {
      const grid = document.getElementById('version-grid');
      const filtered = getFilteredVersions();

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-12 text-center text-slate-500 font-mono">
            <p class="text-base mb-1">No clients found matching "${searchQuery}"</p>
            <p class="text-xs text-slate-600">Try searching for "galactic", "wurst", "1.8", "shaders", or "pvp"</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(v => `
        <div 
          onclick="loadVersion('${v.id}')"
          class="client-card p-4 rounded-xl border border-slate-800 bg-slate-900/80 hover:bg-slate-800/80 cursor-pointer flex flex-col justify-between ${v.id === currentVersionId ? 'active' : ''}"
          data-id="${v.id}"
        >
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="font-bold text-sm text-white">${v.name}</span>
              <span class="text-[9px] font-mono px-1.5 py-0.5 rounded font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                ${v.tag}
              </span>
            </div>
            <p class="text-xs text-slate-400 mb-4 line-clamp-2">${v.desc}</p>
          </div>
          <div class="pt-2 border-t border-slate-800 flex items-center justify-between">
            <span class="text-[10px] font-mono text-slate-500">${v.type}</span>
            <span class="text-xs font-semibold text-emerald-400 flex items-center gap-1 group-hover:translate-x-1 transition-transform">
              Play &rarr;
            </span>
          </div>
        </div>
      `).join('');
    }

    function loadVersion(id, scroll = true) {
      const v = VERSIONS.find(x => x.id === id);
      if (!v) return;

      currentVersionId = id;
      document.getElementById('active-title').textContent = v.name;
      document.getElementById('active-tag').textContent = v.tag;
      
      const iframe = document.getElementById('player-iframe');
      iframe.src = `./downloads/${v.file}`;
      iframe.onload = () => { iframe.focus(); };

      document.querySelectorAll('.client-card').forEach(c => {
        if (c.getAttribute('data-id') === id) {
          c.classList.add('active');
        } else {
          c.classList.remove('active');
        }
      });

      if (scroll && window.innerWidth < 640) {
        document.getElementById('player-frame-wrapper').scrollIntoView({ behavior: 'smooth' });
      }
    }

    function reloadPlayer() {
      const iframe = document.getElementById('player-iframe');
      iframe.src = iframe.src;
      iframe.focus();
    }

    function toggleFullscreen() {
      const wrapper = document.getElementById('player-frame-wrapper');
      const iframe = document.getElementById('player-iframe');
      if (!document.fullscreenElement) {
        wrapper.requestFullscreen().then(() => {
          if (iframe) iframe.focus();
        }).catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function popOut() {
      const v = VERSIONS.find(x => x.id === currentVersionId);
      if (v) {
        window.open(`./downloads/${v.file}`, '_blank');
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
